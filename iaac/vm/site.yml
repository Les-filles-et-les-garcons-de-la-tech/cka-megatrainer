# The whole CKA lab: `make vm-up` (exam layout) or `make vm-up HA=1` (3 control planes behind a load
# balancer). Every step is idempotent.
- name: Inventory of the chosen layout
  ansible.builtin.import_playbook: inventory.yml
- name: libvirt network, disks and VMs
  ansible.builtin.import_playbook: host.yml
- name: Node prerequisites and the load balancer
  ansible.builtin.import_playbook: nodes.yml
- name: kubeadm cluster
  ansible.builtin.import_playbook: cluster.yml

- name: Cluster add-ons (the same pinned set as the kind lab)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [group_vars/all.yml]
  tasks:
    - name: iaac/addons.sh against the VM cluster
      ansible.builtin.command: ./addons.sh
      args: {chdir: "{{ iaac_dir }}"}
      environment: {IAAC_TARGET: vm, ADDONS: "{{ addons | default('') }}"}  # ADDONS=full: the controllers
      register: addons
      changed_when: true

    - name: Add-ons output
      ansible.builtin.debug: {var: addons.stdout_lines}
