<text x="9" y="14.04" fill="#000000" font-weight="bold" textLength="702" lengthAdjust="spacingAndGlyphs">CKA MEGATRAINER  Q1/1  NET-002  Services &amp; Networking  ·  step 1/2  ·  score 0</text>
<rect x="0" y="18" width="729" height="18" fill="#00ff00"/>
<text x="729" y="32.04" fill="#7f7f7f" textLength="36" lengthAdjust="spacingAndGlyphs">░░░░</text>
<text x="783" y="32.04" fill="#00ff00" font-weight="bold" textLength="99" lengthAdjust="spacingAndGlyphs">85.4s / 90s</text>
<text x="9" y="68.04" fill="#ffffff" font-weight="bold" textLength="351" lengthAdjust="spacingAndGlyphs">Expose a Deployment outside the cluster</text>
<text x="9" y="86.04" fill="#ffffff" textLength="882" lengthAdjust="spacingAndGlyphs">Deployment &#x27;web&#x27; (label app=web) listens on container port 8080. Expose it as Service &#x27;web-svc&#x27; on</text>
<text x="27" y="104.04" fill="#ffffff" textLength="459" lengthAdjust="spacingAndGlyphs">port 80, reachable from outside through every node.</text>
<text x="9" y="140.04" fill="#00ffff" font-weight="bold" textLength="369" lengthAdjust="spacingAndGlyphs">Step 1 - Create the Service imperatively.</text>
<text x="27" y="158.04" fill="#ffffff" textLength="828" lengthAdjust="spacingAndGlyphs">A) kubectl expose deployment web --name=web-svc --port=80 --target-port=8080 --type=NodePort</text>
<text x="27" y="176.04" fill="#ffffff" textLength="828" lengthAdjust="spacingAndGlyphs">B) kubectl expose deployment web --name=web-svc --port=8080 --target-port=80 --type=NodePort</text>
<text x="27" y="194.04" fill="#ffffff" textLength="864" lengthAdjust="spacingAndGlyphs">C) kubectl expose deployment web --name=web-svc --port=80 --target-port=8080 --type=LoadBalancer</text>
<text x="27" y="212.04" fill="#ffffff" textLength="684" lengthAdjust="spacingAndGlyphs">D) kubectl expose deployment web --name=web-svc --port=80 --target-port=8080</text>
<text x="0" y="248.04" fill="#00ffff" textLength="900" lengthAdjust="spacingAndGlyphs">┌ Your answer ─────────────────────────────────────────────────────────────────────────────────────┐</text>
