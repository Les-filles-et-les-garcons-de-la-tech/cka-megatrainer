<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="916" height="700" viewBox="-8 -8 916 700">
<style>text{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace;font-size:15px;white-space:pre}</style>
<rect x="-8" y="-8" width="916" height="700" rx="8" fill="#000000"/>
<rect x="0" y="0" width="900" height="18" fill="#ffffff"/>
<text x="9" y="14.04" fill="#000000" font-weight="bold" textLength="513" lengthAdjust="spacingAndGlyphs">CLU-002  step 1/3  ·  Cluster lifecycle (kubeadm upgrade)</text>
<text x="18" y="50.04" fill="#ff0000" font-weight="bold" textLength="63" lengthAdjust="spacingAndGlyphs">✘ WRONG</text>
<text x="18" y="68.04" fill="#7f7f7f" textLength="252" lengthAdjust="spacingAndGlyphs">Time 0.9s of 75s   +0 points</text>
<text x="18" y="104.04" fill="#00ffff" font-weight="bold" textLength="81" lengthAdjust="spacingAndGlyphs">Question:</text>
<text x="36" y="122.04" fill="#00ffff" textLength="747" lengthAdjust="spacingAndGlyphs">Step 1 - From the control plane: safely evict the workloads from node01 and make it</text>
<text x="54" y="140.04" fill="#00ffff" textLength="126" lengthAdjust="spacingAndGlyphs">unschedulable.</text>
<text x="18" y="176.04" fill="#ffffff" font-weight="bold" textLength="90" lengthAdjust="spacingAndGlyphs">You typed:</text>
<text x="36" y="194.04" fill="#ffff00" textLength="207" lengthAdjust="spacingAndGlyphs">$ kubectl cordon node01</text>
<text x="18" y="212.04" fill="#ffffff" font-weight="bold" textLength="315" lengthAdjust="spacingAndGlyphs">That is option C - why it is wrong:</text>
<text x="36" y="230.04" fill="#ffffff" textLength="639" lengthAdjust="spacingAndGlyphs">Cordon only marks the node unschedulable; running Pods are NOT evicted.</text>
<text x="18" y="266.04" fill="#ffffff" font-weight="bold" textLength="135" lengthAdjust="spacingAndGlyphs">Correct answer:</text>
<text x="36" y="284.04" fill="#00ff00" textLength="585" lengthAdjust="spacingAndGlyphs">$ kubectl drain node01 --ignore-daemonsets --delete-emptydir-data</text>
<text x="18" y="320.04" fill="#00ffff" font-weight="bold" textLength="36" lengthAdjust="spacingAndGlyphs">Why:</text>
<text x="36" y="338.04" fill="#ffffff" textLength="810" lengthAdjust="spacingAndGlyphs">Drain cordons the node (no new Pods) and evicts the running ones so they restart elsewhere</text>
<text x="54" y="356.04" fill="#ffffff" textLength="792" lengthAdjust="spacingAndGlyphs">instead of dying with the upgrade. It refuses unless you accept that DaemonSet Pods stay</text>
<text x="54" y="374.04" fill="#ffffff" textLength="657" lengthAdjust="spacingAndGlyphs">(--ignore-daemonsets) and emptyDir data is lost (--delete-emptydir-data).</text>
<text x="18" y="410.04" fill="#ffff00" font-weight="bold" textLength="144" lengthAdjust="spacingAndGlyphs">The other traps:</text>
<text x="36" y="428.04" fill="#ffffff" font-weight="bold" textLength="261" lengthAdjust="spacingAndGlyphs">A) kubectl delete node node01</text>
<text x="108" y="446.04" fill="#ffff00" textLength="711" lengthAdjust="spacingAndGlyphs">→ Removes the Node object entirely; the node would have to re-join the cluster.</text>
<text x="36" y="482.04" fill="#ffffff" font-weight="bold" textLength="207" lengthAdjust="spacingAndGlyphs">D) kubectl drain node01</text>
<text x="108" y="500.04" fill="#ffff00" textLength="765" lengthAdjust="spacingAndGlyphs">→ Refuses to proceed when DaemonSet Pods (CNI, kube-proxy) or emptyDir volumes exist:</text>
<text x="126" y="518.04" fill="#ffff00" textLength="261" lengthAdjust="spacingAndGlyphs">it needs the two extra flags.</text>
<text x="0" y="680.04" fill="#7f7f7f" textLength="225" lengthAdjust="spacingAndGlyphs">Enter: continue   q: quit</text>
</svg>