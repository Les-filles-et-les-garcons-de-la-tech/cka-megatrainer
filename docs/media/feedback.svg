<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="916" height="700" viewBox="-8 -8 916 700">
<style>text{font-family:'DejaVu Sans Mono','Menlo','Consolas',monospace;font-size:15px;white-space:pre}</style>
<rect x="-8" y="-8" width="916" height="700" rx="8" fill="#000000"/>
<rect x="0" y="0" width="900" height="18" fill="#ffffff"/>
<text x="9" y="14.04" fill="#000000" font-weight="bold" textLength="513" lengthAdjust="spacingAndGlyphs">CLU-002  step 1/3  ·  Cluster lifecycle (kubeadm upgrade)</text>
<text x="18" y="50.04" fill="#ff0000" font-weight="bold" textLength="63" lengthAdjust="spacingAndGlyphs">✘ WRONG</text>
<text x="18" y="68.04" fill="#7f7f7f" textLength="252" lengthAdjust="spacingAndGlyphs">Time 0.8s of 75s   +0 points</text>
<text x="18" y="104.04" fill="#ffffff" font-weight="bold" textLength="90" lengthAdjust="spacingAndGlyphs">You typed:</text>
<text x="36" y="122.04" fill="#ffff00" textLength="207" lengthAdjust="spacingAndGlyphs">$ kubectl cordon node01</text>
<text x="18" y="140.04" fill="#ffffff" font-weight="bold" textLength="315" lengthAdjust="spacingAndGlyphs">That is option A - why it is wrong:</text>
<text x="36" y="158.04" fill="#ffffff" textLength="639" lengthAdjust="spacingAndGlyphs">Cordon only marks the node unschedulable; running Pods are NOT evicted.</text>
<text x="18" y="194.04" fill="#ffffff" font-weight="bold" textLength="135" lengthAdjust="spacingAndGlyphs">Correct answer:</text>
<text x="36" y="212.04" fill="#00ff00" textLength="585" lengthAdjust="spacingAndGlyphs">$ kubectl drain node01 --ignore-daemonsets --delete-emptydir-data</text>
<text x="18" y="248.04" fill="#00ffff" font-weight="bold" textLength="36" lengthAdjust="spacingAndGlyphs">Why:</text>
<text x="36" y="266.04" fill="#ffffff" textLength="819" lengthAdjust="spacingAndGlyphs">drain = cordon + evict. DaemonSet Pods cannot be evicted (--ignore-daemonsets) and emptyDir</text>
<text x="54" y="284.04" fill="#ffffff" textLength="342" lengthAdjust="spacingAndGlyphs">data is lost (--delete-emptydir-data).</text>
<text x="18" y="320.04" fill="#7f7f7f" font-weight="bold" textLength="144" lengthAdjust="spacingAndGlyphs">The other traps:</text>
<text x="36" y="338.04" fill="#7f7f7f" textLength="720" lengthAdjust="spacingAndGlyphs">B) Removes the Node object entirely; the node would have to re-join the cluster.</text>
<text x="36" y="356.04" fill="#7f7f7f" textLength="855" lengthAdjust="spacingAndGlyphs">D) Refuses to proceed when DaemonSet Pods (CNI, kube-proxy) or emptyDir volumes exist: it needs</text>
<text x="54" y="374.04" fill="#7f7f7f" textLength="180" lengthAdjust="spacingAndGlyphs">the two extra flags.</text>
<text x="0" y="680.04" fill="#7f7f7f" textLength="225" lengthAdjust="spacingAndGlyphs">Enter: continue   q: quit</text>
</svg>